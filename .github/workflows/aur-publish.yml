name: Publish to AUR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Shared with weekly-update.yml so two runs never push to the AUR at once.
concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A run that waited in the concurrency queue may be older than main by
      # now; publishing it would roll the AUR back to an older PKGBUILD.
      - name: Skip if main has moved on
        id: fresh
        run: |
          set -euo pipefail
          HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$HEAD" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $HEAD, not $GITHUB_SHA; skipping"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to AUR
        if: steps.fresh.outputs.current == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: vesktop-bun
          pkgbuild: ./PKGBUILD
          assets: |
            vesktop.desktop
            vesktop.sh
          commit_username: ${{ github.actor }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "update from GitHub ${{ github.sha }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
          force_push: false
