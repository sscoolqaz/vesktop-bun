name: Weekly release check

on:
  schedule:
    # 18:00 UTC = noon America/Chicago during CST (winter). During CDT
    # (roughly Mar-Nov) this fires at 1pm Central instead of noon, since
    # GitHub Actions cron is fixed UTC and doesn't shift for DST.
    - cron: '0 18 * * 2'
  workflow_dispatch:

permissions:
  contents: write

# Shared with aur-publish.yml so two runs never push to the AUR at once.
concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump PKGBUILD to the latest upstream release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEWVER="$(gh api repos/Vencord/Vesktop/releases/latest --jq .tag_name)"
          NEWVER="${NEWVER#v}"
          CURVER="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"

          if [[ -z "$NEWVER" || "$NEWVER" == "$CURVER" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUM="$(curl -fsSL "https://github.com/Vencord/Vesktop/archive/v${NEWVER}.tar.gz" | sha256sum | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=${NEWVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=('[0-9a-f]*'/sha256sums=('${SUM}'/" PKGBUILD
          # Fail rather than publish if a sed matched nothing.
          grep -qx "pkgver=${NEWVER}" PKGBUILD
          grep -q "^sha256sums=('${SUM}'" PKGBUILD
          echo "newver=${NEWVER}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          git commit -m "chore: update to ${{ steps.bump.outputs.newver }}"
          git push origin main

      # Pushes made with the default GITHUB_TOKEN (the "Commit and push" step
      # above) don't trigger other workflows, so aur-publish.yml's `on: push`
      # never fires for this bot commit. Publish inline instead, and do it on
      # every run, not only after a bump: the deploy action makes no commit
      # when the AUR already matches, so this also retries a publish that
      # failed in an earlier run.
      # Same guard as aur-publish.yml: if main moved on while this run waited
      # in the concurrency queue, publishing this checkout would roll back.
      - name: Skip if main has moved on
        id: fresh
        run: |
          set -euo pipefail
          HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$HEAD" == "$(git rev-parse HEAD)" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $HEAD, not $(git rev-parse HEAD); skipping"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to AUR
        if: steps.fresh.outputs.current == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: vesktop-bun
          pkgbuild: ./PKGBUILD
          assets: |
            vesktop.desktop
            vesktop.sh
          commit_username: ${{ github.actor }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "update from GitHub (weekly release check)"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
          force_push: false
